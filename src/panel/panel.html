<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小红书收藏库</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>

<header>
  <h1>我的收藏库</h1>
  <span id="count" class="count">0 条</span>
  <button id="btn-select" class="mini" type="button">选择</button>
  <button id="btn-menu" class="mini icon" type="button" title="更多">⋯</button>
</header>

<p id="status" class="status">先切到小红书收藏页，再点「开始采集」。</p>

<div id="aiprog" class="aiprog">
  <div class="aiprog-head">
    <span id="aiprogText">AI 正在分类…</span>
    <button type="button" id="aiprogStop" class="link">停止</button>
  </div>
  <div class="aiprog-bar"><i id="aiprogFill"></i></div>
</div>

<div class="chipwrap">
  <div id="chips" class="chips"></div>
  <button type="button" class="chipnav l" id="chipPrev" aria-label="向左看">‹</button>
  <button type="button" class="chipnav r" id="chipNext" aria-label="向右看">›</button>
</div>
<div id="tipbar" class="tipbar"></div>
<div id="syncbar" class="syncbar"></div>

<div class="search">
  <input id="search" type="search" placeholder="搜标题、作者、备注…">
</div>

<main id="list" class="list"></main>
<div id="more" class="more">继续滚动加载更多</div>

<div id="selbar" class="selbar">
  <div class="sel-row">
    <span id="selInfo">已选 0 条</span>
    <button type="button" data-act="all" id="selAll" class="plain">全选</button>
  </div>
  <div class="sel-row">
    <button type="button" data-act="move">移动</button>
    <button type="button" data-act="export">导出</button>
    <button type="button" data-act="unfav" class="warn">取消收藏</button>
    <button type="button" data-act="cancel">取消</button>
  </div>
</div>

<div id="scrim" class="scrim"></div>

<section id="detail" class="sheet">
  <div class="sheet-head">
    <button type="button" class="link back" id="detailBack" aria-label="返回" title="返回"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h2>笔记详情</h2>
  </div>
  <div class="sheet-body">
    <div class="d-note">
      <div class="cover"><img id="dCover" alt=""></div>
      <div class="d-text">
        <p id="dTitle" class="title"></p>
        <p id="dMeta" class="meta"></p>
      </div>
    </div>
    <label class="field">
      <span>所属文件夹</span>
      <select id="dFolder"></select>
    </label>
    <label class="field">
      <span>备注</span>
      <textarea id="dNote" rows="4" placeholder="比如「先量尺寸」「秋天去」"></textarea>
    </label>
  </div>
  <div class="sheet-foot">
    <button type="button" id="dOpen" class="ghost">打开原笔记</button>
    <button type="button" id="dUnfav" class="ghost warn">取消收藏</button>
    <button type="button" id="dSave" class="primary">保存</button>
  </div>
</section>

<section id="menu" class="sheet">
  <div class="sheet-head">
    <button type="button" class="link back" id="menuBack" aria-label="返回" title="返回"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h2>更多操作</h2>
  </div>
  <div class="sheet-body menu">
    <button type="button" class="menu-item" data-menu="collect">开始采集 <small>默认 1000 条</small></button>
    <button type="button" class="menu-item" data-menu="ai">AI 自动归类 <small>DeepSeek</small></button>
    <button type="button" class="menu-item" data-menu="export">导出 CSV <small>存下载文件夹</small></button>
    <button type="button" class="menu-item" data-menu="folders">管理文件夹</button>
    <button type="button" class="menu-item" data-menu="sync">续跑取消收藏 <small>删文件夹后没跑完的</small></button>
    <button type="button" class="menu-item" data-menu="settings">设置 <small>DeepSeek Key</small></button>
    <button type="button" class="menu-item danger" data-menu="clear">清空本地数据</button>
  </div>
</section>

<section id="collect" class="sheet">
  <div class="sheet-head">
    <button type="button" class="link back" id="collectBack" aria-label="返回" title="返回"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h2>开始采集</h2>
  </div>
  <div class="sheet-body">
    <p class="ai-desc" id="collectDesc">点一个条数就开始。页面会自动往下滚，<b>别切走这个标签页</b>。</p>
    <button type="button" id="targetStop" class="ghost block warn" hidden>停止采集</button>
    <div class="target-grid" id="targetGrid">
      <button type="button" data-target="100">100 条<small>不到 1 分钟</small></button>
      <button type="button" data-target="300">300 条<small>1~2 分钟</small></button>
      <button type="button" data-target="500">500 条<small>2~3 分钟</small></button>
      <button type="button" data-target="1000">1000 条<small>3~5 分钟</small></button>
    </div>
  </div>
</section>

<section id="folders" class="sheet">
  <div class="sheet-head">
    <button type="button" class="link back" id="foldersBack" aria-label="返回" title="返回"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h2>管理文件夹</h2>
  </div>
  <div class="sheet-body">
    <div id="folderList" class="folder-list"></div>
    <button type="button" id="folderNew" class="ghost block">＋ 新建文件夹</button>
  </div>
</section>

<section id="ai" class="sheet">
  <div class="sheet-head">
    <button type="button" class="link back" id="aiBack" aria-label="返回" title="返回"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h2>AI 自动归类</h2>
  </div>
  <div class="sheet-body">
    <p id="aiDesc" class="ai-desc">让 AI 看标题，建议每条该进哪个文件夹。</p>
    <div class="ai-tools" id="aiTools" hidden>
      <button type="button" id="aiAll">全选</button>
      <button type="button" id="aiNone">全不选</button>
    </div>
    <div id="aiList" class="ai-list"></div>
  </div>
  <div class="sheet-foot">
    <button type="button" id="aiStart" class="ghost">开始分析</button>
    <button type="button" id="aiConfirm" class="primary" disabled>确认归类</button>
  </div>
</section>

<section id="settings" class="sheet">
  <div class="sheet-head">
    <button type="button" class="link back" id="settingsBack" aria-label="返回" title="返回"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h2>设置</h2>
  </div>
  <div class="sheet-body">
    <label class="field">
      <span>DeepSeek API Key</span>
      <input id="keyInput" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false">
    </label>
    <p class="hint">只存在这台电脑的浏览器里，只用于调用 DeepSeek 给收藏分类。采集到的标题不会发往其他地方。</p>
  </div>
  <div class="sheet-foot">
    <button type="button" id="keyClear" class="ghost">清除</button>
    <button type="button" id="keySave" class="primary">保存</button>
  </div>
</section>

<section id="pick" class="modal">
  <h2 id="pickTitle">移动到文件夹</h2>
  <div id="pickBody" class="pick-body"></div>
  <div class="modal-foot">
    <button type="button" class="ghost" data-close="pick">取消</button>
    <button type="button" class="primary" id="pickOk">确定</button>
  </div>
</section>

<section id="naming" class="modal">
  <h2 id="namingTitle">新建文件夹</h2>
  <input id="namingInput" type="text" placeholder="文件夹名，比如「装修灵感」" maxlength="20">
  <div class="modal-foot">
    <button type="button" class="ghost" data-close="naming">取消</button>
    <button type="button" class="primary" id="namingOk">创建</button>
  </div>
</section>

<section id="confirm" class="modal">
  <h2 id="confirmTitle">确认</h2>
  <p id="confirmBody" class="confirm-body"></p>
  <div class="modal-foot">
    <button type="button" class="ghost" data-close="confirm">取消</button>
    <button type="button" class="primary" id="confirmOk">确定</button>
  </div>
</section>

<div id="toast" class="toast"></div>

<script type="module" src="panel.js"></script>
</body>
</html>
